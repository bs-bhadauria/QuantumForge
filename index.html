<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantumForge Studio Platform | Precision Quantum Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Custom design tokens from Stitch Quantum Precision
              "on-primary-fixed": "#002022",
              "secondary-fixed-dim": "#cdbdff",
              "outline-variant": "#3a494b",
              "on-error": "#690005",
              "on-surface": "#dfe2ef",
              "surface-bright": "#353943",
              "primary-container": "#00f2fe",
              "on-error-container": "#ffdad6",
              "inverse-primary": "#00696f",
              "outline": "#849495",
              "inverse-on-surface": "#2c303a",
              "tertiary-fixed-dim": "#4edea3",
              "surface-container-lowest": "#0a0e17",
              "surface-variant": "#31353f",
              "background": "#0f131c",
              "on-secondary-fixed-variant": "#4e1dbe",
              "primary-fixed": "#6ff6ff",
              "on-secondary-fixed": "#20005f",
              "surface-container": "#1c1f29",
              "primary": "#e0fdff",
              "on-primary-container": "#006a70",
              "secondary-fixed": "#e7deff",
              "error": "#ffb4ab",
              "surface-container-highest": "#31353f",
              "on-secondary-container": "#bca9ff",
              "surface-container-low": "#181b25",
              "primary-fixed-dim": "#00dce6",
              "on-surface-variant": "#b9cacb",
              "inverse-surface": "#dfe2ef",
              "on-tertiary-fixed": "#002113",
              "on-tertiary-container": "#006e4b",
              "tertiary-fixed": "#6ffbbe",
              "tertiary-container": "#67f4b7",
              "surface-tint": "#00dce6",
              "secondary": "#cdbdff",
              "tertiary": "#e1ffec",
              "secondary-container": "#4e1dbe",
              "on-secondary": "#360096",
              "on-primary": "#00373a",
              "surface": "#0f131c",
              "on-background": "#dfe2ef",
              "on-tertiary-fixed-variant": "#005236",
              "on-tertiary": "#003824",
              "surface-container-high": "#262a34",
              "surface-dim": "#0f131c",
              "on-primary-fixed-variant": "#004f53",
              "error-container": "#93000a",

              // Additional workspace aliases
              "void-base": "#0A0D14",
              "cryo-slate": "#0F172A",
              "cryo-surface": "#1E293B",
              "primary-cyan": "#00F0FF",
              "amber-entangle": "#F59E0B",
              "violet-rotate": "#8B5CF6",
              "emerald-pure": "#10B981",
              "crimson-fault": "#EF4444",
            },
            spacing: {
              "space-xl": "1.5rem",
              "space-md": "0.75rem",
              "space-sm": "0.5rem",
              "margin": "1rem",
              "gutter-panel": "1px",
              "space-xs": "0.25rem",
              "margin-compact": "0.5rem",
              "gutter": "0.75rem",
              "space-lg": "1rem",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Space Grotesk", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
              "label-code-sm": ["JetBrains Mono", "monospace"],
              "body-sm": ["Inter", "sans-serif"],
              "headline-sm": ["Inter", "sans-serif"],
              "headline-lg": ["Inter", "sans-serif"],
              "label-code-lg": ["JetBrains Mono", "monospace"],
              "headline-xl": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "label-code-md": ["JetBrains Mono", "monospace"],
              "body-md": ["Inter", "sans-serif"],
            },
            fontSize: {
              "label-code-sm": ["10px", { lineHeight: "12px", letterSpacing: "0.02em", fontWeight: "400" }],
              "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "headline-sm": ["18px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "500" }],
              "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }],
              "label-code-lg": ["13px", { lineHeight: "18px", letterSpacing: "-0.01em", fontWeight: "500" }],
              "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
              "body-lg": ["15px", { lineHeight: "22px", fontWeight: "400" }],
              "label-code-md": ["11px", { lineHeight: "14px", letterSpacing: "0em", fontWeight: "500" }],
              "body-md": ["13px", { lineHeight: "18px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 16px;
        line-height: 1;
        display: inline-block;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
      }
      .quantum-glow-cyan {
        box-shadow: 0 0 16px -2px rgba(0, 242, 254, 0.35);
      }
      .quantum-glow-violet {
        box-shadow: 0 0 16px -2px rgba(127, 90, 240, 0.35);
      }
      .quantum-grid-bg {
        background-image: linear-gradient(to right, rgba(51, 65, 85, 0.15) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(51, 65, 85, 0.15) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .wire-line {
        height: 1px;
        background: #334155;
      }
      .wire-double {
        height: 3px;
        border-top: 1px solid #475569;
        border-bottom: 1px solid #475569;
      }
      @keyframes border-beam {
        100% {
          offset-distance: 100%;
        }
      }
      @keyframes aurora-bg {
        0% {
          background-position: 50% 50%, 50% 50%;
        }
        100% {
          background-position: 350% 50%, 350% 50%;
        }
      }
      .animate-aurora-bg {
        animation: aurora-bg 30s linear infinite;
      }
      @keyframes glow-conic {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .glow-conic {
        animation: glow-conic var(--glow-animation-duration, 4s) linear infinite;
      }
    </style>
  </head>
  <body class="bg-[#0A0D14] text-[#E1E2EC] font-sans antialiased selection:bg-cyan-500/20 selection:text-cyan-200 min-h-screen">
    <!-- Legacy compatibility layer -->
    <div id="legacy-compatibility" style="display:none;" aria-hidden="true">
      <div id="apiStatus">API Online</div>
      <select id="preset"><option value="bell">Bell</option><option value="grover">Grover</option></select>
      <input id="shots" value="1024" />
      <input id="seed" value="42" />
      <textarea id="circuitJson"></textarea>
      <button id="renderButton">Render</button>
      <button id="runButton">Run</button>
      <div id="circuitDiagram"><svg><line x1="0" y1="0" x2="10" y2="10"/><rect/><circle/><text>H</text></svg></div>
      <div id="histogram"></div>
      <div id="rawResult"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
