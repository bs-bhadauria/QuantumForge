name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  python-quality-and-tests:
    name: Python Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code formatting and linting (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Python regression tests (pytest)
        run: |
          python -m pytest

  browser-quality-and-tests:
    name: Browser Quality & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for FastAPI backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Check JavaScript formatting (prettier)
        run: npm run lint:js

      - name: Install Playwright Chromium browser & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser tests
        run: npm run test:e2e

      - name: Upload Playwright test results artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/

  docker-build-and-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: quantumforge:ci
          load: true

      - name: Test container startup and health check
        run: |
          docker run -d --name qf-ci-test -p 8000:8000 quantumforge:ci
          sleep 5
          docker ps
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health
          docker stop qf-ci-test
          docker rm qf-ci-test

