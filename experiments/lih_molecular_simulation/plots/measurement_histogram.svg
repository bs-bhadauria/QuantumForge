<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" style="background:#090d16; border-radius:12px; font-family:'Inter', sans-serif;">
  <!-- Title -->
  <text x="80" y="32" fill="#f8fafc" font-size="16" font-weight="700">LiH VQE Measurement State Probabilities (4,096 Shots)</text>
  <text x="80" y="48" fill="#64748b" font-size="11">Sampling Distribution on QuantumForge Aer-Matrix Simulator</text>

  <!-- Y-Axis Grids -->
  
      <line x1="80" y1="340" x2="680" y2="340" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="68" y="344" fill="#94a3b8" font-size="11" text-anchor="end">0%</text>
    
      <line x1="80" y1="270" x2="680" y2="270" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="68" y="274" fill="#94a3b8" font-size="11" text-anchor="end">25%</text>
    
      <line x1="80" y1="200" x2="680" y2="200" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="68" y="204" fill="#94a3b8" font-size="11" text-anchor="end">50%</text>
    
      <line x1="80" y1="130" x2="680" y2="130" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="68" y="134" fill="#94a3b8" font-size="11" text-anchor="end">75%</text>
    
      <line x1="80" y1="60" x2="680" y2="60" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="68" y="64" fill="#94a3b8" font-size="11" text-anchor="end">100%</text>
    

  <!-- Baseline -->
  <line x1="80" y1="340" x2="680" y2="340" stroke="#475569" stroke-width="1.5"/>

  <!-- Bars -->
  
      <!-- Bar for |0011⟩ (σ²) -->
      <rect x="136" y="67.78399999999999" width="80" height="272.216" rx="4" fill="#00f2fe" opacity="0.9"/>
      <text x="176" y="59.78399999999999" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="middle">97.22%</text>
      <text x="176" y="45.78399999999999" fill="#94a3b8" font-size="10" text-anchor="middle">3982 shots</text>
      <text x="176" y="360" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">|0011⟩ (σ²)</text>
    
      <!-- Bar for |0110⟩ (σ→σ*) -->
      <rect x="272" y="336.024" width="80" height="3.9759999999999995" rx="4" fill="#f59e0b" opacity="0.9"/>
      <text x="312" y="328.024" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">1.42%</text>
      <text x="312" y="314.024" fill="#94a3b8" font-size="10" text-anchor="middle">58 shots</text>
      <text x="312" y="360" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">|0110⟩ (σ→σ*)</text>
    
      <!-- Bar for |1001⟩ (σ→σ*) -->
      <rect x="408" y="336.164" width="80" height="3.8360000000000003" rx="4" fill="#a855f7" opacity="0.9"/>
      <text x="448" y="328.164" fill="#a855f7" font-size="11" font-weight="700" text-anchor="middle">1.37%</text>
      <text x="448" y="314.164" fill="#94a3b8" font-size="10" text-anchor="middle">56 shots</text>
      <text x="448" y="360" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">|1001⟩ (σ→σ*)</text>
    
      <!-- Bar for |1100⟩ (σ*²) -->
      <rect x="544" y="337" width="80" height="3" rx="4" fill="#64748b" opacity="0.9"/>
      <text x="584" y="329" fill="#64748b" font-size="11" font-weight="700" text-anchor="middle">0%</text>
      <text x="584" y="315" fill="#94a3b8" font-size="10" text-anchor="middle">0 shots</text>
      <text x="584" y="360" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">|1100⟩ (σ*²)</text>
    
</svg>