<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" style="background:#090d16; border-radius:12px; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="corrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="90" y="32" fill="#f8fafc" font-size="16" font-weight="700">Potential Energy Surface (PES) of Lithium Hydride (LiH)</text>
  <text x="90" y="50" fill="#64748b" font-size="11">Hartree-Fock vs. VQE Ground State Energy (STO-3G Active Space)</text>

