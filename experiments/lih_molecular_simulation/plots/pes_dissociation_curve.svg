  <line x1="90" y1="60" x2="90" y2="410" stroke="#475569" stroke-width="1.5"/>
  <line x1="90" y1="410" x2="750" y2="410" stroke="#475569" stroke-width="1.5"/>

  <!-- Axis Labels -->
  <text x="400" y="460" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Internuclear Bond Distance R (Å)</text>
  <text transform="rotate(-90)" x="-240" y="28" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Energy (Hartree)</text>

  <!-- Shaded Correlation Area -->
