    <circle cx="712.3" cy="253.8" r="4" fill="#00f2fe" stroke="#090d16" stroke-width="1.5"/>
  

  <!-- Equilibrium Pin -->
  <line x1="296.48571428571427" y1="80" x2="296.48571428571427" y2="346.07885185185216" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="296.48571428571427" cy="346.07885185185216" r="6" fill="#f59e0b" filter="url(#glow)"/>
  <rect x="221.48571428571427" y="68" width="150" height="24" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="296.48571428571427" y="84" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">R_eq = 1.595 Å (-8.203 Ha)</text>

  <!-- Legend -->
