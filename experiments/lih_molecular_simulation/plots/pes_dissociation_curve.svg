    <text x="372.85714285714283" y="430" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="middle">2.0</text><line x1="467.1428571428571" y1="60" x2="467.1428571428571" y2="410" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="467.1428571428571" y="430" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="middle">2.5</text><line x1="561.4285714285714" y1="60" x2="561.4285714285714" y2="410" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="561.4285714285714" y="430" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="middle">3.0</text><line x1="655.7142857142857" y1="60" x2="655.7142857142857" y2="410" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
