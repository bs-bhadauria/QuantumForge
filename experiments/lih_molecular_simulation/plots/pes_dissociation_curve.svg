    <text x="75" y="245.48148148148206" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="end">-7.8</text><line x1="90" y1="189.62962962963013" x2="750" y2="189.62962962963013" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="75" y="193.62962962963013" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="end">-7.6</text><line x1="90" y1="137.77777777777823" x2="750" y2="137.77777777777823" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="75" y="141.77777777777823" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="end">-7.4</text><line x1="90" y1="85.92592592592631" x2="750" y2="85.92592592592631" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="75" y="89.92592592592631" fill="#94a3b8" font-size="11" font-family="Inter, sans-serif" text-anchor="end">-7.2</text>
  <line x1="184.28571428571428" y1="60" x2="184.28571428571428" y2="410" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
